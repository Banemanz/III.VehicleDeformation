; VehDeformIII - GTA III 1.0 EN
; Generated only when missing. Existing INIs are never overwritten.

[VehDeformIII]
Enabled=1
OnlyPlayerVehicle=0

; GTA III native damage-impulse scale.
MinimumImpulse=25.0
FullDeformationImpulse=500.0
ImpulseExponent=0.70
PlayerDeformationScale=1.0
NonPlayerDeformationScale=0.85

; One vehicle-space crush field, evaluated through each component's current frame.
Radius=1.10
MaximumRadius=1.85
MaximumDeformationPerImpact=0.32
MaximumTotalDeformation=0.72
CenterResistance=0.55
InwardNormalBlend=0.18
RimPull=0.04

; Wheel geometry is not deformed. The wheel dummy is translated only while
; CAutomobile::Render is making its final CEntity::Render/RpClumpRender call,
; then immediately restored so GTA III suspension/steering remains authoritative.
WheelSync=1
WheelSyncStrength=0.45
WheelSyncRadiusScale=1.10
WheelSyncMaxOffset=0.16
WheelSyncVerticalScale=0.15

MaximumVerticesPerAtomic=10000
CollisionSampleMaxAgeFrames=2
