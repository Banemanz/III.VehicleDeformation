; VehDeformIII - GTA III 1.0 EN
; IDB/VC comparison baseline. Existing runtime INIs are never overwritten.

[VehDeformIII]
Enabled=1
OnlyPlayerVehicle=0

; GTA III raw damage-impulse domain. Stock VehicleDamage gates at 25.
MinimumImpulse=25.0
FullDeformationImpulse=400.0
ImpulseExponent=0.70
PlayerDeformationScale=1.0
NonPlayerDeformationScale=0.85

; Spherical direct field over immutable rest vertices.
Radius=1.20
MaximumRadius=1.80
MaximumDeformationPerImpact=0.32
MaximumTotalDeformation=0.72
CenterResistance=0.40
InwardNormalBlend=0.0

; Isolated from body deformation while the body path is being stabilized.
WheelSync=0
WheelSyncStrength=0.45
WheelSyncRadiusScale=1.10
WheelSyncMaxOffset=0.16
WheelSyncVerticalScale=0.15

MaximumVerticesPerAtomic=10000
CollisionSampleMaxAgeFrames=2
